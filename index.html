<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senin İçin 🤍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            color: #5a5a5a;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 90%;
            width: 450px;
            z-index: 10;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #d4a5a5;
            font-weight: 600;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #666;
        }

        .button {
            background-color: #d4a5a5;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(212, 165, 165, 0.4);
        }

        .button:hover {
            background-color: #c48b8b;
            transform: scale(1.05);
        }

        #messageBox {
            margin-top: 25px;
            font-size: 17px;
            font-weight: 500;
            color: #c48b8b;
            min-height: 45px;
            transition: opacity 0.4s ease;
            font-style: italic;
        }

        /* Uçuşan Kalpler İçin Animasyon */
        .heart {
            position: absolute;
            font-size: 24px;
            color: #f7a8a8;
            animation: floatUp 4s linear infinite;
            opacity: 0;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yanındayım Yavrum 🤍</h1>
        <p>Şu an aramızda mesafeler olabilir ama kalbim tam olarak orada, seninle.</p>
        <p>Ağlamak istiyorsan bırak aksın gözyaşların. Ben her damlasında seni sarmak için buradayım.</p>
        <p>Her şey geçecek. Sen çok güçlüsün ve ben hep yanında olacağım.</p>
        
        <button class="button" onclick="showMessage()">Bana Sarıl</button>
        <div id="messageBox"></div>
    </div>

    <script>
        // Rastgele çıkacak sevgi dolu mesajlar
        const messages = [
            "Kocaman, sımsıcak sarıldım sana...",
            "Güzelim her zaman yanındayım.",
            "Ne kadar uzakta olursak olalım, ellerim ellerinde.",
            "Gülüşünü dünyalara değişmem.",
            "Derin bir nefes al, ben hep seninleyim.",
            "Şu an yanında olamasam da sevgim seni sarıp sarmalasın.",
            "İyi ki varsın, iyi ki buradasın."
        ];

        function showMessage() {
            const messageBox = document.getElementById('messageBox');
            const randomIndex = Math.floor(Math.random() * messages.length);
            
            // Yumuşak geçiş efekti
            messageBox.style.opacity = 0;
            setTimeout(() => {
                messageBox.textContent = messages[randomIndex];
                messageBox.style.opacity = 1;
            }, 200);

            createHearts(6);
        }

        function createHearts(amount) {
            for (let i = 0; i < amount; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '🤍';
                heart.className = 'heart';
                // Ekranda rastgele yerlerden çıkması için
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(heart);

                // Animasyon bitince kalbi DOM'dan temizle
                setTimeout(() => {
                    heart.remove();
                }, 4000);
            }
        }
    </script>
</body>
</html>
